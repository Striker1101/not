<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #ffffff; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; background: #1a1f2e; border-radius: 24px; padding: 40px; border: 1px solid rgba(255,255,255,0.05); }
        .logo { font-size: 24px; font-weight: 900; color: #3b82f6; text-transform: uppercase; margin-bottom: 30px; letter-spacing: 2px; }
        h1 { font-size: 32px; font-weight: 900; margin-bottom: 20px; color: #ffffff; }
        p { line-height: 1.6; color: #94a3b8; font-size: 16px; }
        .footer { margin-top: 40px; font-size: 12px; color: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">BlockArt Notification</div>
        <h1>Security Update</h1>
        <p>{{message}}</p>
        <div class="footer">
            &copy; 2026 BlockArt NFT Protocol. Distributed Ledger Security Enabled.
        </div>
    </div>
</body>
</html>
